name: Pull request validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Core tests and Windows package
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install build dependencies
        timeout-minutes: 30
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::Max-Downloads=8 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::Max-Downloads=8 install --no-install-recommends --yes build-essential g++-mingw-w64-x86-64-posix nsis python3

      - name: Run core tests, Windows build, and package verification
        run: make package CROSS_CXX=x86_64-w64-mingw32-g++-posix
