name: Windows v1.4.0 production-key portable update

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  production-key-portable-update:
    if: ${{ github.ref == 'refs/heads/feature/v1.4.0-automatic-updater' }}
    name: Update portable install using the exact production-signed candidate
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out public production trust configuration and reviewed harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify the retained authoritative candidate identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runId = '44875679345'
          $artifactId = '14695418078'
          $artifactName = "EyeBreakReminder-v1.4.0-production-candidate-$runId"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $run = Invoke-RestMethod -Headers $headers -Uri "$base/actions/runs/$runId"
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_branch -cne 'feature/v1.4.0-automatic-updater') { throw 'The pinned production candidate finalizer run is not successful on the approved feature branch.' }
          $artifactList = Invoke-RestMethod -Headers $headers -Uri "$base/actions/runs/$runId/artifacts?per_page=100"
          $artifact = @($artifactList.artifacts | Where-Object { [string]$_.id -ceq $artifactId -and $_.name -ceq $artifactName -and -not $_.expired })
          if ($artifact.Count -ne 1 -or [long]$artifact[0].size_in_bytes -ne 8517500) { throw 'The exact retained production candidate artifact is missing, expired, ambiguous, or has an unexpected size.' }
          [pscustomobject]@{Status='PASS';RunId=$runId;RunUrl=$run.html_url;ArtifactId=$artifactId;ArtifactName=$artifactName;ArtifactBytes=[long]$artifact[0].size_in_bytes;ExpiresAt=$artifact[0].expires_at;SourceCommit='491bd2ed29f84f4d434b884fc723144db2d6f294'} | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'candidate-run-identity.json' -Encoding utf8

      - name: Install Windows build and verification tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-python
            mingw-w64-x86_64-openssl

      - name: Expose MinGW strip under the cross-tool alias expected by the baseline script
        shell: msys2 {0}
        run: |
          set -euo pipefail
          strip_tool="$(command -v strip)"
          test -x "$strip_tool"
          cp "$strip_tool" /mingw64/bin/x86_64-w64-mingw32-strip.exe
          test -x /mingw64/bin/x86_64-w64-mingw32-strip.exe

      - name: Record the MSYS2 tool directory for the isolated baseline build
        shell: msys2 {0}
        run: printf 'MSYS2_ROOT=%s\n' "$(cygpath -aw /)" >> "$GITHUB_ENV"

      - name: Download the exact finalizer artifact by run and name
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: 44875679345
          github-token: ${{ github.token }}
          name: EyeBreakReminder-v1.4.0-production-candidate-44875679345
          path: signed-candidate

      - name: Verify all seven final-candidate files and production manifest signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'signed-candidate\final-candidate'
          $expected = @{
            'EyeBreakReminder.exe' = @{ Bytes=2889728; SHA256='07f6c1eaee5818df9f5c024310883ca94b8274a4f451186a8123974fb5e5f720' }
            'EyeBreakReminder-Setup-x64.exe' = @{ Bytes=1395896; SHA256='a15fc525557603dbed1ef0dccb8d128e500dfee91c6416b478513de790dd5c9b' }
            'EyeBreakReminder-Portable-x64.zip' = @{ Bytes=1573754; SHA256='a579b0e3cd7573f4214b0df4ff25dee99801735123658afd70e455886189c2be' }
            'EyeBreakReminder-Source.zip' = @{ Bytes=2650888; SHA256='a915342af6e50122a2d511e4cb91eb036de9b4fbf21889d6ecfcb9de1c8c140d' }
            'EyeBreakReminder-SHA256.txt' = @{ Bytes=382; SHA256='5fc0ed3317c3e4e0ad1b57ffc2cef435031db8024d7a1ca024ff14d1b46a9538' }
            'EyeBreakReminder-UpdateManifest.json' = @{ Bytes=682; SHA256='e599ff055613366133ba8a03bae3f7acff9ac383d24214cc0c620a7efbe9a682' }
            'EyeBreakReminder-UpdateManifest.sig' = @{ Bytes=64; SHA256='411372a2b5a1836968d60b6f1c3e3c7d21830df3c43d92728366653833f6b8c8' }
          }
          if (-not (Test-Path -LiteralPath $release -PathType Container)) { throw 'The authoritative candidate directory is missing.' }
          $actualNames = @(Get-ChildItem -LiteralPath $release -File | ForEach-Object Name | Sort-Object)
          $expectedNames = @($expected.Keys | Sort-Object)
          if (($actualNames -join "`n") -cne ($expectedNames -join "`n")) { throw 'The candidate file set differs from the exact seven-file production release set.' }
          $verified = @()
          foreach ($name in $expectedNames) {
            $file = Get-Item -LiteralPath (Join-Path $release $name)
            $digest = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ([long]$file.Length -ne [long]$expected[$name].Bytes -or $digest -cne $expected[$name].SHA256) { throw "Candidate identity mismatch: $name" }
            $verified += [pscustomobject]@{Name=$name;Bytes=[long]$file.Length;SHA256=$digest}
          }
          $metadata = Get-Content -LiteralPath (Join-Path $release 'EyeBreakReminder-UpdateManifest.json') -Raw | ConvertFrom-Json
          if ($metadata.version -cne '1.4.0' -or $metadata.channel -cne 'stable' -or $metadata.architecture -cne 'x64' -or $metadata.key_id -cne 'p256-0aff97759ea95258' -or $metadata.application -cne 'Eye Break Reminder' -or $metadata.repository -cne 'REMEDIOSSAMUEL/EYE-BREAK-REMINDER') { throw 'The signed production manifest identifies the wrong release, key, application, repository, channel, or architecture.' }
          if ($metadata.assets.Count -ne 2 -or $metadata.assets[0].name -cne 'EyeBreakReminder-Setup-x64.exe' -or $metadata.assets[0].role -cne 'installer' -or $metadata.assets[0].installation_type -cne 'installed' -or $metadata.assets[0].architecture -cne 'x64' -or $metadata.assets[0].sha256 -cne $expected['EyeBreakReminder-Setup-x64.exe'].SHA256 -or $metadata.assets[1].name -cne 'EyeBreakReminder.exe' -or $metadata.assets[1].role -cne 'portable-update' -or $metadata.assets[1].installation_type -cne 'portable' -or $metadata.assets[1].architecture -cne 'x64' -or $metadata.assets[1].sha256 -cne $expected['EyeBreakReminder.exe'].SHA256) { throw 'The signed production manifest does not bind the exact installer and portable payloads to their intended roles.' }
          $trust = Get-Content -LiteralPath 'src/update_trust.hpp' -Raw
          if ($trust -notmatch 'ProductionUpdateKeyId\s*=\s*"p256-0aff97759ea95258"' -or $trust -match 'TestUpdateKey|TestPublicKey') { throw 'The checked-out application trust root is not the exact production key or contains test trust.' }
          $exe = Get-Item -LiteralPath (Join-Path $release 'EyeBreakReminder.exe')
          $setup = Get-Item -LiteralPath (Join-Path $release 'EyeBreakReminder-Setup-x64.exe')
          if ($exe.VersionInfo.ProductVersion -notmatch '^1\.4\.0(\.0)?$' -or $setup.VersionInfo.ProductVersion -notmatch '^1\.4\.0(\.0)?$') { throw 'Candidate PE version resources do not identify v1.4.0.' }
          New-Item -ItemType Directory -Path 'build\v1.4.0-updater-evidence' -Force | Out-Null
          [pscustomobject]@{Status='PASS';CandidateRunId='44875679345';CandidateArtifactId='14695418078';SourceCommit='491bd2ed29f84f4d434b884fc723144db2d6f294';KeyId=$metadata.key_id;Files=$verified} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'build\v1.4.0-updater-evidence\production-portable-candidate-identity.json' -Encoding utf8

      - name: Build production-trust v1.3.0 test baseline and CNG verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msysBin = Join-Path $env:MSYS2_ROOT 'mingw64\bin'
          $env:PATH = $msysBin + [IO.Path]::PathSeparator + $env:PATH
          & .\tests\build_production_trust_baseline.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & make build/updater-windows-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0
          $baseline = Join-Path $env:RUNNER_TEMP 'EyeBreakReminder-ProductionTrust-Baseline-1.3.0\release\EyeBreakReminder.exe'
          if (-not (Test-Path -LiteralPath $baseline -PathType Leaf) -or (Get-Item -LiteralPath $baseline).VersionInfo.ProductVersion -notmatch '^1\.3\.0(\.0)?$') { throw 'The isolated production-trust v1.3.0 baseline was not built.' }

      - name: Verify and execute the production-key portable update transaction
        timeout-minutes: 12
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'signed-candidate\final-candidate'
          $baseline = Join-Path $env:RUNNER_TEMP 'EyeBreakReminder-ProductionTrust-Baseline-1.3.0\release\EyeBreakReminder.exe'
          New-Item -ItemType Directory -Path '.\build\v1.4.0-updater-evidence' -Force | Out-Null
          & .\build\updater-windows-tests.exe --verify-production-manifest `
            (Join-Path $release 'EyeBreakReminder-UpdateManifest.json') `
            (Join-Path $release 'EyeBreakReminder-UpdateManifest.sig') 'v1.4.0' '1.3.0'
          if ($LASTEXITCODE -ne 0) { throw 'Windows CNG rejected the authentic candidate signature against the embedded production key.' }
          $global:LASTEXITCODE = 0
          & .\tests\windows_signed_update_gui_acceptance.ps1 `
            -TestApplication $baseline `
            -SuccessorInstaller (Join-Path $release 'EyeBreakReminder-Setup-x64.exe') `
            -SuccessorApplication (Join-Path $release 'EyeBreakReminder.exe') `
            -SignatureTool '.\build\updater-windows-tests.exe' `
            -ProductionManifest (Join-Path $release 'EyeBreakReminder-UpdateManifest.json') `
            -ProductionSignature (Join-Path $release 'EyeBreakReminder-UpdateManifest.sig') `
            -PackageKind 'portable' `
            -BaselineVersion '1.3.0' `
            -UpdateVersion '1.4.0' `
            -EvidencePath '.\build\v1.4.0-updater-evidence\production-signed-portable-update.json'
          if ($LASTEXITCODE -ne 0) { throw 'The production-key portable update acceptance harness failed.' }
          $global:LASTEXITCODE = 0
          $report = Get-Content -LiteralPath '.\build\v1.4.0-updater-evidence\production-signed-portable-update.json' -Raw | ConvertFrom-Json
          if ($report.Status -cne 'PASS' -or $report.InstallationType -cne 'portable' -or $report.TestKeyRejectedByProductionTrust -ne $true -or -not $report.SettingsPreserved -or -not $report.HistoryPreserved -or -not $report.Relaunched -or -not $report.TimerAdvanced) { throw 'The portable production-trust transaction evidence does not contain the expected PASS assertions.' }

      - name: Retain exact candidate identity and production portable transaction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EyeBreakReminder-v1.4.0-production-signed-portable-update-${{ github.run_id }}
          path: |
            candidate-run-identity.json
            build/v1.4.0-updater-evidence/production-portable-candidate-identity.json
            build/v1.4.0-updater-evidence/production-signed-portable-update.json
          if-no-files-found: warn
          retention-days: 90
