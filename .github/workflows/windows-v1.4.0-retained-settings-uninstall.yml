          $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
          $summary = "Requirement: UN-009`nCandidate: artifact $($identity.ArtifactId), EXE SHA-256 $($identity.CandidateEXESHA256)`nOS: $($identity.OS) build $($identity.OSBuild); OS/native process architecture $($identity.OSArchitecture)/$($identity.ProcessArchitecture)`nEnvironment: GitHub-hosted disposable Windows Server 2025 x64 active console desktop; temporary standard-user account`nConsole session: $($preflight.Process.SessionId) ($($preflight.Process.SessionName)); active WTS Console session: $($preflight.WTS.ActiveConsoleSessionId)`nWhole desktop captures disabled: $($result.WholeDesktopCapturesDisabled)`nUN-009 result: $($result.Status)`nReason: $($result.Failure)`nSettings Apps subtest: $($result.SettingsAppsUninstall) — $($result.SettingsAppsUninstallReason)`nTemporary account removed: $($result.AccountRemoved); staging removed: $($result.StageRemoved); cleanup errors: $(@($result.CleanupErrors).Count)`n"
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $summary
          if ($result.Status -eq 'FAIL') { throw "Standard-user console Settings uninstall harness failed: $($result.Failure)" }
          if ($result.Status -eq 'BLOCKED') {
            $childGuardBlocked = @($result.Events | Where-Object { $_.Name -eq 'Child active-console prelaunch guard' -and $_.Status -eq 'BLOCKED' }).Count -gt 0
            if ($childGuardBlocked) { Write-Warning 'UN-009 remains blocked by the child prelaunch guard; candidate app execution was prevented.' }
            else { Write-Warning 'UN-009 remains blocked during isolated standard-user provisioning; the candidate app was not launched.' }
          }
          if ($result.Status -eq 'PASS') { Write-Host 'Exact production candidate passed the standard-user Settings uninstall acceptance harness on the verified console desktop.' }

      - name: Recheck the seven candidate files remain byte-identical
        if: always() && steps.candidate_identity.outcome == 'success'
        shell: pwsh
        run: |
          $identity = Get-Content 'remaining-coverage-evidence/standard-user-console/candidate-identity.json' -Raw | ConvertFrom-Json
          foreach ($file in $identity.Files) {
            $path = Join-Path 'production-candidate-artifact/final-candidate' $file.Name
            if (-not (Test-Path -LiteralPath $path) -or (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $file.SHA256) { throw "Candidate bytes changed during the test: $($file.Name)" }
          }
          Write-Host 'PASS: all seven downloaded production candidate files remain byte-identical.'

      - name: Retain active-console preflight, standard-user logs, screenshots, and candidate identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1.4.0-un-009-console-standard-user-${{ github.run_id }}
          path: remaining-coverage-evidence/standard-user-console/**
          if-no-files-found: warn
          retention-days: 90

  isolated-lock-unlock-windows-server-x64:
    name: Exact candidate lock/unlock in a separate disposable Windows Server x64 guest
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the PR test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download authoritative production candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.4.0-production-candidate-44875679345
          run-id: 44875679345
          repository: REMEDIOSSAMUEL/EYE-BREAK-REMINDER
          github-token: ${{ github.token }}
          path: production-candidate-artifact

      - name: Run exact-candidate lock/unlock in a loopback-only temporary RDP session
        shell: pwsh
        env:
          EBR_RUNNER_ENVIRONMENT_CONTEXT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:EBR_RUNNER_ENVIRONMENT_CONTEXT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64') { throw 'ENV-006 harness requires a fresh GitHub-hosted Windows x64 runner.' }
          $exe = Join-Path $PWD 'production-candidate-artifact/final-candidate/EyeBreakReminder.exe'
          $expected = '07f6c1eaee5818df9f5c024310883ca94b8274a4f451186a8123974fb5e5f720'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "ENV-006 candidate hash mismatch: $actual" }
          $evidence = Join-Path $env:RUNNER_TEMP 'env006-lock-unlock-evidence'
          & .\tests\windows_server_rdp_lock_unlock_acceptance.ps1 -CandidateExecutable $exe -EvidenceDirectory $evidence
          $reportPath = Join-Path $evidence 'env006-lock-unlock-results.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'ENV-006 harness produced no evidence report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $summary = "Requirement: ENV-006`nCandidate: artifact $($report.CandidateArtifactId), SHA-256 $($report.CandidateSHA256)`nOS: $($report.OS) version $($report.OSVersion) build $($report.OSBuild)`nOS/native CPU: $($report.OSArchitecture) / $($report.ProcessArchitecture)`nEnvironment: $($report.Environment)`nRDP session: $($report.RdpSessionId); temporary user SID: $($report.TemporaryUserSid)`nStatus: $($report.Status)`nReason: $($report.Reason)`nCleanup errors: $(@($report.CleanupErrors).Count)`n"
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $summary
          if ($report.Status -eq 'FAIL') { throw "Exact-candidate ENV-006 harness found a product failure: $($report.Reason)" }
          if ($report.Status -ne 'PASS') { Write-Warning 'ENV-006 remains blocked; actual session-lock evidence and cleanup results are retained.' }

      - name: Preserve lock/unlock screenshots, session evidence, and cleanup records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1.4.0-env-006-lock-unlock-${{ github.run_id }}
          path: ${{ runner.temp }}/env006-lock-unlock-evidence/**
          if-no-files-found: warn
          retention-days: 90
