name: v1.4.0 retained candidate Settings uninstall

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# Windows 11 ARM64 desktop jobs require `run-win11-arm64-ui-probes` because the
# hosted image's first-sign-in OOBE was already observed and blocked the exact
# candidate. The separate `approve-win11-privacy-oobe-next` label is the only
# workflow path that passes the explicit OOBE Next opt-in to those probes.

permissions:
  actions: read
  contents: read

jobs:
  audio-endpoint-preflight:
    name: Exact candidate Windows 11 ARM64 audio endpoint preflight
    if: contains(github.event.pull_request.labels.*.name, 'run-win11-arm64-ui-probes')
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Check out the endpoint probe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download authoritative production candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.4.0-production-candidate-44875679345
          run-id: 44875679345
          repository: REMEDIOSSAMUEL/EYE-BREAK-REMINDER
          github-token: ${{ github.token }}
          path: production-candidate-artifact

      - name: Verify the exact executable and record Windows audio endpoints
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'production-candidate-artifact/final-candidate/EyeBreakReminder.exe'
          $expected = '07f6c1eaee5818df9f5c024310883ca94b8274a4f451186a8123974fb5e5f720'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Audio probe candidate hash mismatch: $actual" }
          & .\tests\windows_audio_endpoint_inventory.ps1 `
            -EvidenceDirectory '.\remaining-coverage-evidence\audio-endpoint' `
            -CandidateRunId '44875679345' `
            -CandidateExeSHA256 $expected
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content '.\remaining-coverage-evidence\audio-endpoint\windows-audio-endpoint-inventory.json' -Raw | ConvertFrom-Json
          $summary = @(
            '**Exact-candidate audio endpoint preflight (not a REG-008 PASS)**'
            ''
            "Candidate artifact 14695418078; EXE SHA-256 $($report.CandidateExecutableSHA256)."
            "OS: $($report.OS) $($report.OSVersion); OS architecture $($report.OSArchitecture); candidate x64 emulation is not native x64."
            "WinMM endpoints: $($report.WinMM.DeviceCount). Active WASAPI render endpoints: $($report.WASAPI.ActiveRenderEndpointCount)."
            "Result: $($report.WindowsAudioOutputAndLoopbackStatus). $($report.Reason)"
          ) -join "`n"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $summary
          Write-Host $summary

      - name: Retain audio endpoint capability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1.4.0-reg-008-audio-endpoint-preflight-${{ github.run_id }}
          path: remaining-coverage-evidence/audio-endpoint/**
          if-no-files-found: warn
          retention-days: 90

  narrator-speech-recap-windows-11-arm64:
    name: Exact candidate Narrator speech-content and keyboard accessibility probe
    if: contains(github.event.pull_request.labels.*.name, 'run-win11-arm64-ui-probes')
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Check out the PR test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download authoritative production candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.4.0-production-candidate-44875679345
          run-id: 44875679345
          repository: REMEDIOSSAMUEL/EYE-BREAK-REMINDER
          github-token: ${{ github.token }}
          path: production-candidate-artifact

      - name: Verify exact candidate and run Narrator Speech Recap against real controls
        shell: pwsh
        env:
          EBR_ALLOW_PRIVACY_OOBE_NEXT: ${{ contains(github.event.pull_request.labels.*.name, 'approve-win11-privacy-oobe-next') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'production-candidate-artifact/final-candidate'
          $expected = '07f6c1eaee5818df9f5c024310883ca94b8274a4f451186a8123974fb5e5f720'
          $exe = Join-Path $release 'EyeBreakReminder.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Exact candidate executable is missing.' }
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Narrator candidate hash mismatch: $actual" }
          $evidence = Join-Path $PWD 'remaining-coverage-evidence/narrator'
          $arguments = @{ ExecutablePath=$exe; EvidenceDirectory=$evidence }
          if ($env:EBR_ALLOW_PRIVACY_OOBE_NEXT -eq 'true') { $arguments.AllowExactPrivacyOobeNext = $true }
          & .\tests\windows_narrator_speech_recap_acceptance.ps1 @arguments
          if (-not (Test-Path -LiteralPath (Join-Path $evidence 'gui-016-narrator-speech-recap.json'))) { throw 'Narrator harness produced no result report.' }
          $report = Get-Content (Join-Path $evidence 'gui-016-narrator-speech-recap.json') -Raw | ConvertFrom-Json
          $freshCaptures = @($report.Narrator.Captures | Where-Object { $_.ValidatedFreshPhrase -eq $true -and $_.FreshText -eq $true -and $_.PhraseIncludesFullAccessibleName -eq $true })
          $summary = "Requirement: GUI-016`nCandidate: artifact $($report.Candidate.ArtifactId), SHA-256 $($report.Candidate.SHA256)`nOS: $($report.OperatingSystem.Caption) $($report.OperatingSystem.Version) build $($report.OperatingSystem.Build)`nOS/native CPU: $($report.OperatingSystem.OSArchitecture) / $($report.OperatingSystem.NativeProcessorArchitecture)`nEnvironment: GitHub-hosted interactive Windows 11 ARM64; candidate x64 emulation`nStatus: $($report.Status)`nReason: $($report.Reason)`nValidated fresh speech captures: $($freshCaptures.Count)`nPhysical audio verified: $($report.Narrator.PhysicalAudioVerified)`n"
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $summary
          if ($report.Status -eq 'FAIL') { throw "Narrator acceptance harness found a product failure: $($report.Reason)" }

      - name: Preserve Narrator speech-content logs and target-window screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1.4.0-gui-016-narrator-speech-${{ github.run_id }}
          path: remaining-coverage-evidence/narrator/**
          if-no-files-found: warn
          retention-days: 90

  candidate-audio-controls-windows-11-arm64:
    name: Exact candidate alarm controls and Windows WASAPI loopback attempt
    if: contains(github.event.pull_request.labels.*.name, 'run-win11-arm64-ui-probes')
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 25
    steps:
      - name: Check out the PR test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download authoritative production candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.4.0-production-candidate-44875679345
          run-id: 44875679345
          repository: REMEDIOSSAMUEL/EYE-BREAK-REMINDER
          github-token: ${{ github.token }}
          path: production-candidate-artifact

      - name: Exercise real alarm settings and capture Windows render samples when an endpoint exists
        shell: pwsh
        env:
          EBR_ALLOW_PRIVACY_OOBE_NEXT: ${{ contains(github.event.pull_request.labels.*.name, 'approve-win11-privacy-oobe-next') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'production-candidate-artifact/final-candidate/EyeBreakReminder.exe'
          $expected = '07f6c1eaee5818df9f5c024310883ca94b8274a4f451186a8123974fb5e5f720'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Audio acceptance candidate hash mismatch: $actual" }
          $evidence = Join-Path $PWD 'remaining-coverage-evidence/audio-controls'
          $arguments = @{ ExecutablePath=$exe; EvidenceDirectory=$evidence }
          if ($env:EBR_ALLOW_PRIVACY_OOBE_NEXT -eq 'true') { $arguments.AllowExactPrivacyOobeNext = $true }
          & .\tests\windows_candidate_audio_loopback_acceptance.ps1 @arguments
          $reportPath = Join-Path $evidence 'reg-008-audio-loopback-results.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'REG-008 audio harness produced no result report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $summary = "Requirement: REG-008`nCandidate: artifact $($report.ArtifactId), SHA-256 $($report.CandidateExecutableSHA256)`nOS: $($report.OperatingSystem.Caption) version $($report.OperatingSystem.Version) build $($report.OperatingSystem.Build)`nOS/process architecture: $($report.OperatingSystem.OSArchitecture) / $($report.OperatingSystem.ProcessArchitecture)`nEnvironment: fresh GitHub-hosted interactive Windows 11 ARM64; exact x64 candidate under emulation`nActive render endpoint: $($report.AudioEndpoint.ActiveRenderEndpointCount); loopback: $($report.WasapiLoopbackStatus)`nPhysical audible output: $($report.PhysicalAudibility)`nResult: $($report.Status) — $($report.Reason)`n"
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $summary
          if ($report.Status -eq 'FAIL') { throw "Exact-candidate REG-008 harness found a product failure: $($report.Reason)" }

      - name: Preserve audio controls, WASAPI capture and result evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1.4.0-reg-008-audio-controls-${{ github.run_id }}
          path: remaining-coverage-evidence/audio-controls/**
          if-no-files-found: warn
          retention-days: 90

  shell-notification-windows-11-arm64:
    name: Exact candidate Windows Shell notification display and activation probe
    if: contains(github.event.pull_request.labels.*.name, 'run-win11-arm64-ui-probes')
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 20
    steps:
      - name: Check out the PR test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download authoritative production candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.4.0-production-candidate-44875679345
          run-id: 44875679345
          repository: REMEDIOSSAMUEL/EYE-BREAK-REMINDER
          github-token: ${{ github.token }}
          path: production-candidate-artifact

      - name: Run a natural one-minute reminder and inspect the real Windows Shell surface
        shell: pwsh
        env:
          EBR_ALLOW_PRIVACY_OOBE_NEXT: ${{ contains(github.event.pull_request.labels.*.name, 'approve-win11-privacy-oobe-next') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'production-candidate-artifact/final-candidate/EyeBreakReminder.exe'
          $expected = '07f6c1eaee5818df9f5c024310883ca94b8274a4f451186a8123974fb5e5f720'
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Shell notification candidate hash mismatch: $actual" }
          $evidence = Join-Path $PWD 'remaining-coverage-evidence/shell-notification'
          $arguments = @{ ExecutablePath=$exe; EvidenceDirectory=$evidence }
          if ($env:EBR_ALLOW_PRIVACY_OOBE_NEXT -eq 'true') { $arguments.AllowPrivacyOobeNext = $true }
          & .\tests\windows_shell_notification_acceptance.ps1 @arguments
          $reportPath = Join-Path $evidence 'env-009-shell-notification-results.json'
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Shell notification harness produced no result report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $summary = "Requirement: ENV-009`nCandidate: artifact $($report.Candidate.ArtifactId), SHA-256 $($report.Candidate.SHA256)`nOS: $($report.OperatingSystem.Caption) $($report.OperatingSystem.Version) build $($report.OperatingSystem.Build)`nEnvironment: GitHub-hosted interactive Windows 11 ARM64; candidate x64 emulation`nShell visibility subtest: $($report.ShellNotificationVisibilityStatus) — $($report.ShellNotificationVisibilityReason)`nNotification audio: $($report.Audio.Status); physical output verified: $($report.Audio.PhysicalAudioVerified)`nOverall ENV-009: $($report.Status) — $($report.Reason)`n"
          $summary | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host $summary
          if ($report.Status -eq 'FAIL') { throw "Exact-candidate Shell acceptance harness found a failure: $($report.Reason)" }

      - name: Preserve Windows Shell UIA evidence and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v1.4.0-env-009-shell-notification-${{ github.run_id }}
          path: remaining-coverage-evidence/shell-notification/**
          if-no-files-found: warn
          retention-days: 90

  windows-server-console-desktop-preflight:
    name: Read-only Windows Server 2025 console desktop preflight (not acceptance)
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Inspect the hosted runner's active console desktop (read-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDirectory = Join-Path $env:GITHUB_WORKSPACE 'remaining-coverage-evidence/server-console-preflight'
          New-Item -ItemType Directory -Force -Path $evidenceDirectory | Out-Null
          $probeErrors = [System.Collections.Generic.List[string]]::new()
          $nativeSource = @'
          using System;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Text;

          public enum EBR_WTS_CONNECT_STATE
          {
              Active = 0, Connected = 1, ConnectQuery = 2, Shadow = 3,
              Disconnected = 4, Idle = 5, Listen = 6, Reset = 7, Down = 8, Init = 9
          }

          public sealed class EBR_WTS_SESSION
          {
              public int SessionId;
              public string Station;
              public string State;
          }

          public static class EBR_SERVER_CONSOLE_NATIVE
          {
              private const int UOI_NAME = 2;
              private const uint DESKTOP_READOBJECTS = 0x0001;

              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              private struct WTS_SESSION_INFO
              {
                  public int SessionId;
                  [MarshalAs(UnmanagedType.LPWStr)] public string Station;
                  public EBR_WTS_CONNECT_STATE State;
              }

              [DllImport("kernel32.dll", SetLastError = true)]
              public static extern uint WTSGetActiveConsoleSessionId();

              [DllImport("wtsapi32.dll", EntryPoint = "WTSEnumerateSessionsW", SetLastError = true, CharSet = CharSet.Unicode)]
              private static extern bool WTSEnumerateSessions(IntPtr server, int reserved, int version, out IntPtr sessions, out int count);

              [DllImport("wtsapi32.dll")]
              private static extern void WTSFreeMemory(IntPtr memory);

              public static EBR_WTS_SESSION[] EnumerateSessions()
              {
                  IntPtr buffer = IntPtr.Zero;
                  int count = 0;
                  if (!WTSEnumerateSessions(IntPtr.Zero, 0, 1, out buffer, out count))
                      throw new Win32Exception(Marshal.GetLastWin32Error(), "WTSEnumerateSessions failed");

                  try
                  {
                      int size = Marshal.SizeOf(typeof(WTS_SESSION_INFO));
                      var rows = new List<EBR_WTS_SESSION>(count);
                      for (int index = 0; index < count; index++)
                      {
                          IntPtr current = IntPtr.Add(buffer, index * size);
                          var row = (WTS_SESSION_INFO)Marshal.PtrToStructure(current, typeof(WTS_SESSION_INFO));
                          rows.Add(new EBR_WTS_SESSION { SessionId = row.SessionId, Station = row.Station, State = row.State.ToString() });
                      }
                      return rows.ToArray();
                  }
                  finally { if (buffer != IntPtr.Zero) WTSFreeMemory(buffer); }
              }

              [DllImport("user32.dll", SetLastError = true)]
              public static extern IntPtr GetProcessWindowStation();

              [DllImport("user32.dll", SetLastError = true)]
              private static extern IntPtr GetThreadDesktop(uint threadId);

              [DllImport("kernel32.dll")]
              private static extern uint GetCurrentThreadId();

              [DllImport("user32.dll", EntryPoint = "OpenInputDesktop", SetLastError = true, CharSet = CharSet.Unicode)]
              private static extern IntPtr OpenInputDesktop(uint flags, bool inherit, uint desiredAccess);

              [DllImport("user32.dll", SetLastError = true)]
              private static extern bool CloseDesktop(IntPtr desktop);

              [DllImport("user32.dll", EntryPoint = "GetUserObjectInformationW", SetLastError = true, CharSet = CharSet.Unicode)]
              private static extern bool GetUserObjectInformation(IntPtr handle, int index, StringBuilder buffer, uint length, out uint needed);

              private static string ObjectName(IntPtr handle)
              {
                  if (handle == IntPtr.Zero) return null;
                  var buffer = new StringBuilder(256);
                  uint needed;
                  if (!GetUserObjectInformation(handle, UOI_NAME, buffer, (uint)(buffer.Capacity * 2), out needed))
                      return "<ERROR:" + Marshal.GetLastWin32Error().ToString() + ">";
                  return buffer.ToString();
              }

              public static string ProcessWindowStationName() { return ObjectName(GetProcessWindowStation()); }
              public static string ThreadDesktopName() { return ObjectName(GetThreadDesktop(GetCurrentThreadId())); }

              public static string InputDesktopName()
              {
                  IntPtr desktop = OpenInputDesktop(0, false, DESKTOP_READOBJECTS);
                  if (desktop == IntPtr.Zero) return "<ERROR:" + Marshal.GetLastWin32Error().ToString() + ">";
                  try { return ObjectName(desktop); }
                  finally { CloseDesktop(desktop); }
              }

              [DllImport("user32.dll", EntryPoint = "FindWindowW", SetLastError = true, CharSet = CharSet.Unicode)]
              private static extern IntPtr FindWindow(string className, string windowName);

              [DllImport("user32.dll", SetLastError = true)]
              private static extern uint GetWindowThreadProcessId(IntPtr window, out uint processId);

              public static IntPtr TaskbarWindow() { return FindWindow("Shell_TrayWnd", null); }
              public static uint TaskbarProcessId(IntPtr window)
              {
                  if (window == IntPtr.Zero) return 0;
                  uint processId;
                  GetWindowThreadProcessId(window, out processId);
                  return processId;
              }
          }
          '@

          $nativeLoaded = $false
          $nativeError = $null
          $sessions = @()
          $activeConsoleSessionId = [uint32]::MaxValue
          $processWindowStation = $null
          $threadDesktop = $null
          $inputDesktop = $null
          $taskbarHandle = [IntPtr]::Zero
          $taskbarProcessId = 0
          try {
            Add-Type -TypeDefinition $nativeSource -ErrorAction Stop
            $nativeLoaded = $true
            $activeConsoleSessionId = [EBR_SERVER_CONSOLE_NATIVE]::WTSGetActiveConsoleSessionId()
            $sessions = @([EBR_SERVER_CONSOLE_NATIVE]::EnumerateSessions() | ForEach-Object {
              [pscustomobject]@{SessionId=$_.SessionId;Station=$_.Station;State=$_.State}
            })
            $processWindowStation = [EBR_SERVER_CONSOLE_NATIVE]::ProcessWindowStationName()
            $threadDesktop = [EBR_SERVER_CONSOLE_NATIVE]::ThreadDesktopName()
            $inputDesktop = [EBR_SERVER_CONSOLE_NATIVE]::InputDesktopName()
            $taskbarHandle = [EBR_SERVER_CONSOLE_NATIVE]::TaskbarWindow()
            $taskbarProcessId = [EBR_SERVER_CONSOLE_NATIVE]::TaskbarProcessId($taskbarHandle)
          } catch {
            $nativeError = $_.Exception.Message
            $probeErrors.Add("Native WTS/desktop query: $nativeError")
          }

          $os = $null
          $computer = $null
          $processors = @()
          try { $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop } catch { $probeErrors.Add("Operating system query: $($_.Exception.Message)") }
          try { $computer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop } catch { $probeErrors.Add("Computer system query: $($_.Exception.Message)") }
          try { $processors = @(Get-CimInstance Win32_Processor -ErrorAction Stop | Select-Object -ExpandProperty Architecture -Unique) } catch { $probeErrors.Add("Processor architecture query: $($_.Exception.Message)") }

          $process = Get-Process -Id $PID -ErrorAction Stop
          $processSessionId = [int]$process.SessionId
          $sessionName = [string]$env:SESSIONNAME
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdministrator = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $userInteractive = [Environment]::UserInteractive
          $consoleSession = @($sessions | Where-Object { [uint32]$_.SessionId -eq $activeConsoleSessionId -and $_.Station -ieq 'Console' } | Select-Object -First 1)
          $consoleSessionActive = ($activeConsoleSessionId -ne [uint32]::MaxValue -and $consoleSession.Count -eq 1 -and $consoleSession[0].State -eq 'Active')
          $processInActiveConsole = ($consoleSessionActive -and $activeConsoleSessionId -ne [uint32]::MaxValue -and [int64]$processSessionId -eq [int64]$activeConsoleSessionId)
          $windowStationConfirmed = ($processWindowStation -ieq 'WinSta0')
          $threadDesktopConfirmed = ($threadDesktop -ieq 'Default')
          $inputDesktopConfirmed = ($inputDesktop -ieq 'Default')
          $explorer = @(Get-Process -Name explorer -ErrorAction SilentlyContinue | Where-Object { $_.SessionId -eq $processSessionId } | Select-Object Id,SessionId,ProcessName)
          $taskbarProcess = $null
          if ($taskbarProcessId -gt 0) { $taskbarProcess = Get-Process -Id ([int]$taskbarProcessId) -ErrorAction SilentlyContinue }
          $taskbarSameSession = ($taskbarHandle -ne [IntPtr]::Zero -and $taskbarProcess -and $taskbarProcess.SessionId -eq $processSessionId)
          $shellSameSession = ($explorer.Count -gt 0 -and $taskbarSameSession)

          $runnerContextValid = ($env:GITHUB_ACTIONS -ceq 'true' -and $env:RUNNER_ENVIRONMENT -ceq 'github-hosted' -and $env:RUNNER_OS -ceq 'Windows' -and $env:RUNNER_ARCH -ieq 'X64' -and $env:GITHUB_SERVER_URL -ceq 'https://github.com' -and $env:GITHUB_REPOSITORY -ieq 'REMEDIOSSAMUEL/EYE-BREAK-REMINDER')
          $osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          $nativeAmd64 = ($os -and $os.Caption -match 'Windows Server 2025' -and $osArchitecture -eq 'X64' -and $processArchitecture -eq 'X64' -and 9 -in $processors)
          $consoleDesktopConfirmed = ($runnerContextValid -and $nativeAmd64 -and $consoleSessionActive -and $processInActiveConsole -and $userInteractive -and $windowStationConfirmed -and $threadDesktopConfirmed -and $inputDesktopConfirmed -and $shellSameSession)
          $probeOutcome = if ($consoleDesktopConfirmed) { 'CONSOLE_DESKTOP_OBSERVED' } elseif (-not $runnerContextValid -or -not $nativeAmd64) { 'REQUIRED_HOST_CONTEXT_NOT_OBSERVED' } else { 'CONSOLE_DESKTOP_NOT_ESTABLISHED' }

          $report = [ordered]@{
            Probe='Windows Server 2025 hosted Console desktop capability only'
            ProbeOutcome=$probeOutcome
            AcceptanceResult='NOT_RUN'
            CandidateDownloaded=$false
            CandidateLaunched=$false
            CandidateArtifactId=$null
            CandidateSHA256=$null
            SystemConfigurationChanged=$false
            SessionOrPowerActionPerformed=$false
            GitHubContext=[pscustomobject]@{IsHostedProjectRunner=$runnerContextValid;Actions=$env:GITHUB_ACTIONS;RunnerEnvironment=$env:RUNNER_ENVIRONMENT;RunnerOS=$env:RUNNER_OS;RunnerArchitecture=$env:RUNNER_ARCH;RunnerName=$env:RUNNER_NAME;Repository=$env:GITHUB_REPOSITORY;RunId=$env:GITHUB_RUN_ID}
            OperatingSystem=[pscustomobject]@{Caption=if($os){$os.Caption}else{$null};Version=if($os){$os.Version}else{$null};Build=if($os){$os.BuildNumber}else{$null};OSArchitecture=$osArchitecture;ProcessArchitecture=$processArchitecture;ProcessorArchitectureCodes=$processors;NativeAmd64=$nativeAmd64;ComputerSystemType=if($computer){$computer.SystemType}else{$null};HypervisorPresent=if($computer){$computer.HypervisorPresent}else{$null}}
            ProcessSession=[pscustomobject]@{ProcessId=$PID;SessionId=$processSessionId;SessionName=$sessionName;User=$identity.Name;UserSid=$identity.User.Value;IsAdministrator=$isAdministrator;UserInteractive=$userInteractive}
