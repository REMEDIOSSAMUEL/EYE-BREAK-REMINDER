name: Build v1.4.1 production candidate

on:
  push:
    branches: [release/v1.4.1-update-validation]
    paths: [VERSION, tests/update_signing_tool_tests.py, .github/workflows/windows-v1.4.1-production-candidate.yml]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-python
            mingw-w64-x86_64-openssl
      - uses: negrutiu/nsis-install@9c575d44c2938a43e38a305caeb403de90303c60
        with:
          version: v3.11.7461.309
      - name: Build and verify the five frozen release files
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          g++ --version
          windres --version
          makensis -VERSION
          make package HOST_CXX=g++ CROSS_CXX=g++ WINDRES=windres STRIP=strip PYTHON=python
      - name: Verify Windows versions and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -cne '1.4.1') { throw 'Wrong candidate release version.' }
          New-Item -ItemType Directory -Path candidate-evidence | Out-Null
          $files = @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip','EyeBreakReminder-SHA256.txt')
          $identities = @(foreach ($name in $files) {
            $file = Get-Item -LiteralPath (Join-Path release $name)
            if ($file.Extension -ceq '.exe') {
              $v = $file.VersionInfo
              if ($v.ProductVersion -cne $version -or $v.FileVersion -cne "$version.0" -or
                  $v.FileVersionRaw.ToString() -cne "$version.0" -or $v.ProductVersionRaw.ToString() -cne "$version.0") {
                throw "Wrong Windows version resources: $name"
              }
            }
            [ordered]@{Name=$name; Bytes=$file.Length; SHA256=(Get-FileHash $file.FullName).Hash.ToLowerInvariant()}
          })
          [ordered]@{
            Status='PASS'; Version=$version; Repository=$env:GITHUB_REPOSITORY
            Branch=$env:GITHUB_REF_NAME; SourceCommit=$env:GITHUB_SHA; RunId=$env:GITHUB_RUN_ID
            Files=$identities
          } | ConvertTo-Json -Depth 5 | Set-Content candidate-evidence/candidate-provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eye-break-reminder-v1.4.1-candidate-${{ github.run_id }}
          path: |
            release/EyeBreakReminder.exe
            release/EyeBreakReminder-Setup-x64.exe
            release/EyeBreakReminder-Portable-x64.zip
            release/EyeBreakReminder-Source.zip
            release/EyeBreakReminder-SHA256.txt
            candidate-evidence/candidate-provenance.json
          if-no-files-found: error
          retention-days: 90
