name: Windows display-change acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful v1.3.0 candidate-producing Windows workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  real-display-change:
    name: Exact-candidate display-resolution change on Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the feature branch test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the candidate sealed by the specified workflow run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.3.0-VERIFIED-RELEASE-CANDIDATE
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: release

      - name: Download the matching candidate seal
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: eye-break-reminder-v1.3.0-final-pre-release-evidence-${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: build/candidate-evidence

      - name: Independently verify the sealed candidate files and provenance
        id: candidate
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d+$') { throw 'Candidate run ID must be numeric.' }
          $sealPath = Get-ChildItem -LiteralPath 'build/candidate-evidence' -Recurse -Filter 'authoritative-release-candidate.json' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sealPath) { throw 'The specified candidate workflow did not retain its authoritative seal.' }
          $seal = Get-Content -LiteralPath $sealPath -Raw | ConvertFrom-Json
          if ($seal.RunId -ne $env:CANDIDATE_RUN_ID -or $seal.Version -ne '1.3.0' -or $seal.Application -ne 'Eye Break Reminder') { throw 'The downloaded seal does not match the requested v1.3.0 Eye Break Reminder candidate run.' }
          $expectedNames = @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip','EyeBreakReminder-SHA256.txt')
          $actualNames = @(Get-ChildItem -LiteralPath 'release' -File | Sort-Object Name | Select-Object -ExpandProperty Name)
          if (($actualNames -join "`n") -cne (($expectedNames | Sort-Object) -join "`n")) { throw "Unexpected candidate artifact file set: $($actualNames -join ', ')" }
          if ($seal.ArtifactFiles.Count -ne 5) { throw 'The seal must identify all five candidate files.' }
          foreach ($item in $seal.ArtifactFiles) {
            $file = Join-Path 'release' $item.Name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Candidate artifact is missing $($item.Name)." }
            $info = Get-Item -LiteralPath $file
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($info.Length -ne [long]$item.Bytes -or $hash -cne ([string]$item.SHA256).ToLowerInvariant()) { throw "Candidate identity mismatch for $($item.Name)." }
          }
          $manifest = Get-Content -LiteralPath 'release/EyeBreakReminder-SHA256.txt'
          if ($manifest.Count -ne 4) { throw 'Candidate manifest must contain exactly four payload hashes.' }
          foreach ($line in $manifest) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Malformed candidate manifest row: $line" }
            $path = Join-Path 'release' $Matches[2]
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $Matches[1]) { throw "Candidate manifest mismatch for $path." }
          }
          $exe = Get-Item -LiteralPath 'release/EyeBreakReminder.exe'
          if ($exe.VersionInfo.ProductVersion -notmatch '^1\.3\.0(\.0)?$') { throw "Wrong candidate executable version: $($exe.VersionInfo.ProductVersion)." }
          "sha256=$((Get-FileHash -LiteralPath 'release/EyeBreakReminder.exe' -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "source_commit=$($seal.SourceCommit)" >> $env:GITHUB_OUTPUT
          "candidate_run_id=$($seal.RunId)" >> $env:GITHUB_OUTPUT
          "candidate_artifact_url=$($seal.ArtifactUrl)" >> $env:GITHUB_OUTPUT
          $seal | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'build/candidate-seal-verified.json' -Encoding UTF8
          [pscustomobject]@{CandidateRunId=$seal.RunId;SourceCommit=$seal.SourceCommit;ExecutableSHA256=(Get-FileHash -LiteralPath 'release/EyeBreakReminder.exe' -Algorithm SHA256).Hash.ToLowerInvariant();Files=$seal.ArtifactFiles;ArtifactUrl=$seal.ArtifactUrl} | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'build/candidate-identity.json' -Encoding UTF8

      - name: Test reminder behavior through a genuine display-resolution change
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.candidate_run_id }}
          CANDIDATE_SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_display_change_acceptance.ps1 `
            -ExecutablePath '.\release\EyeBreakReminder.exe' `
            -ExpectedSha256 '${{ steps.candidate.outputs.sha256 }}' `
            -EvidenceDirectory '.\build\windows-display-change-evidence'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exact-candidate display-change evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eye-break-reminder-v1.3.0-display-change-${{ inputs.candidate_run_id }}-${{ github.run_id }}
          path: |
            build/candidate-identity.json
            build/candidate-seal-verified.json
            build/windows-display-change-evidence/**
          if-no-files-found: warn
          retention-days: 90
