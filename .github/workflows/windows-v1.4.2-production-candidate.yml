name: Verify the frozen v1.4.2 coordinator
on:
  push:
    branches: [verification/v1.4.2-coordinator]
permissions:
  actions: read
  contents: read
jobs:
  installed-preserve:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: '15114134404'
          run-id: '45814044383'
          github-token: ${{ github.token }}
          path: candidate
      - name: Run the exact signed installed coordinator transaction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path candidate/release).Path
          $app = Join-Path $release 'EyeBreakReminder.exe'
          $setup = Join-Path $release 'EyeBreakReminder-Setup-x64.exe'
          $expected = @{
            $app = 'ba47f65caef8a8e37105b1401cdecc46739bc492ee2c413202825ce1c4cfbca9'
            $setup = '1b4feb491b9262b2b8b420be2ee2ed5bac568350d8b860d67984254e904b8ed2'
            'release-inputs/v1.4.2/EyeBreakReminder-UpdateManifest.json' = '507e5fb9294d143413a795f9f99213ff56e260447370e7c8ca1cfa79d81d3c54'
            'release-inputs/v1.4.2/EyeBreakReminder-UpdateManifest.sig' = 'a22352774352462cc2e3a759b08e26bb09f57c5b8adee3bfeb1b29029417c625'
          }
          foreach ($path in $expected.Keys) {
            if ((Get-FileHash -LiteralPath $path).Hash -ine $expected[$path]) { throw "Frozen input hash mismatch: $path" }
          }
          $env:EBR_FOCUS_PREDECESSOR_SETUP = Join-Path $env:RUNNER_TEMP 'v141-setup.exe'
          $previous = Join-Path $env:RUNNER_TEMP 'v141-app.exe'
          $base = 'https://github.com/REMEDIOSSAMUEL/EYE-BREAK-REMINDER/releases/download/v1.4.1'
          Invoke-WebRequest "$base/EyeBreakReminder-Setup-x64.exe" -OutFile $env:EBR_FOCUS_PREDECESSOR_SETUP
          Invoke-WebRequest "$base/EyeBreakReminder.exe" -OutFile $previous
          if ((Get-FileHash $previous).Hash -ine '2db9ca975cd6a46a58cea9257e886c0e33614b646ef194e73a7502d224d61b60' -or
              (Get-FileHash $env:EBR_FOCUS_PREDECESSOR_SETUP).Hash -ine 'b8e44e435fb08470f410cae512fc131c965ccb8d6f6076fd06c8db04a0ffc2bc') { throw 'Wrong public predecessor' }
          ./tests/windows_signed_update_transaction_acceptance.ps1 -TestApplication $previous -SuccessorInstaller $setup -SuccessorApplication $app -SignatureTool $app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: v1.4.2-focused-coordinator-evidence
          path: build/v1.4.0-updater-evidence/signed-update-transactions.json
          if-no-files-found: warn
          retention-days: 90
