name: Windows 11 ARM64 exact-candidate emulation retest

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed Windows Server candidate run ID to retest
        required: true
        type: string
      probe_mode:
        description: Run full acceptance, inventory audio endpoints, or one focused Windows x64 display, standard-user, installed-app, or Narrator/tray check
        required: true
        type: choice
        default: acceptance
        options:
          - acceptance
          - audio-inventory
          - display-only
          - standard-user-only
          - installed-only
          - tray-narrator-only

permissions:
  contents: read

jobs:
  arm64-candidate-emulation:
    if: ${{ inputs.probe_mode == 'acceptance' || inputs.probe_mode == 'audio-inventory' }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the acceptance harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the exact retained candidate from the requested run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.3.0-VERIFIED-RELEASE-CANDIDATE
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Download the requested candidate's sealed provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: eye-break-reminder-v1.3.0-final-pre-release-evidence-${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-evidence

      - name: Verify the exact candidate and source provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidateRunId = $env:CANDIDATE_RUN_ID
          if ($candidateRunId -notmatch '^\d{5,}$') { throw "Invalid candidate run ID: '$candidateRunId'." }
          $run = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId"
          if ($run.status -cne 'completed' -or $run.head_branch -cne 'feature/v1.3.0-custom-accent-colours') { throw 'Requested candidate run must be completed on the authorized feature branch.' }
          $runJobs = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$candidateRunId/jobs?per_page=100"
          $candidateJob = @($runJobs.jobs | Where-Object { $_.name -eq 'windows-pre-release' -and $_.conclusion -eq 'success' }) | Select-Object -First 1
          if (-not $candidateJob) { throw 'Requested run did not complete its Windows pre-release job successfully; no authoritative candidate can be accepted.' }
          $expectedNames = @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip','EyeBreakReminder-SHA256.txt')
          $releaseEntries = @(Get-ChildItem -LiteralPath 'release' -Force)
          if ($releaseEntries.Count -ne 5 -or @($releaseEntries | Where-Object PSIsContainer).Count -ne 0) { throw 'Candidate directory must contain exactly five files and no subdirectories.' }
          $actualNames = @($releaseEntries | Sort-Object Name | Select-Object -ExpandProperty Name)
          if (($actualNames -join "`n") -cne (($expectedNames | Sort-Object) -join "`n")) { throw "Unexpected candidate file set: $($actualNames -join ', ')" }
          $manifest = Get-Content -LiteralPath 'release/EyeBreakReminder-SHA256.txt'
          if ($manifest.Count -ne 4) { throw 'Candidate SHA-256 manifest must contain exactly four payloads.' }
          $fixed = @{}
          foreach ($name in @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip')) {
            $matchingLines = @($manifest | Where-Object { $_ -match ('^[0-9a-f]{64}  ' + [regex]::Escape($name) + '$') })
            if ($matchingLines.Count -ne 1) { throw "Manifest entry missing or duplicated: $name" }
            $manifestMatch = [regex]::Match($matchingLines[0], '^([0-9a-f]{64})  ' + [regex]::Escape($name) + '$')
            if (-not $manifestMatch.Success) { throw "Manifest entry is malformed for $name" }
            $fixed[$name] = $manifestMatch.Groups[1].Value
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $fixed[$name]) { throw "Downloaded candidate hash mismatch for ${name}: $actual" }
          }
          $manifestHash = (Get-FileHash -LiteralPath 'release/EyeBreakReminder-SHA256.txt' -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixed['EyeBreakReminder-SHA256.txt'] = $manifestHash
          $exe = Get-Item -LiteralPath 'release/EyeBreakReminder.exe'
          $setup = Get-Item -LiteralPath 'release/EyeBreakReminder-Setup-x64.exe'
          if ($exe.VersionInfo.ProductVersion -notmatch '^1\.3\.0(\.0)?$' -or $setup.VersionInfo.ProductVersion -notmatch '^1\.3\.0(\.0)?$') { throw 'Downloaded candidate is not version 1.3.0.' }
          $sealPath = Get-ChildItem -LiteralPath 'candidate-evidence' -Recurse -Filter 'authoritative-release-candidate.json' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sealPath) { throw 'Candidate seal was not present in the evidence artifact.' }
          $seal = Get-Content -LiteralPath $sealPath -Raw | ConvertFrom-Json
          if ($seal.RunId -ne $candidateRunId -or $seal.SourceCommit -cne $run.head_sha -or $seal.Version -ne '1.3.0' -or $seal.Tests.ProductionExecutableSHA256 -ne $fixed['EyeBreakReminder.exe']) { throw 'Candidate seal does not identify the requested successful Windows pre-release job, its source commit, and the downloaded executable.' }
          if ($seal.ArtifactFiles.Count -ne 5) { throw 'Candidate seal does not list exactly five files.' }
          foreach ($item in $seal.ArtifactFiles) { if ($item.SHA256 -cne $fixed[$item.Name] -or [long]$item.Bytes -ne [long](Get-Item -LiteralPath (Join-Path 'release' $item.Name)).Length) { throw "Seal identity mismatch for $($item.Name)." } }
          [pscustomobject]@{CandidateRunId=$seal.RunId;CandidateSourceCommit=$seal.SourceCommit;SourceArchiveSHA256=$fixed['EyeBreakReminder-Source.zip'];AcceptanceHarnessCommit=$env:GITHUB_SHA;OS=(Get-CimInstance Win32_OperatingSystem).Caption;OSArchitecture=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString();CandidateFiles=@($expectedNames);SHA256=$fixed;ExecutableVersion=$exe.VersionInfo.ProductVersion;InstallerVersion=$setup.VersionInfo.ProductVersion} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'candidate-identity-retest.json' -Encoding UTF8
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test installer policy and application under ARM64 x64 emulation
        if: ${{ inputs.probe_mode == 'acceptance' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_arm64_emulation_acceptance.ps1 `
            -InstallerPath (Join-Path (Get-Location) 'release/EyeBreakReminder-Setup-x64.exe') `
            -StandaloneExecutable (Join-Path (Get-Location) 'release/EyeBreakReminder.exe') `
            -PortableArchive (Join-Path (Get-Location) 'release/EyeBreakReminder-Portable-x64.zip') `
            -EvidenceDirectory (Join-Path (Get-Location) 'build/arm64-emulation-retest') `
            -CandidateSourceCommit (Get-Content -LiteralPath 'candidate-identity-retest.json' -Raw | ConvertFrom-Json).CandidateSourceCommit
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test standard-user install, Windows Settings uninstall, and UAC behavior
        # The per-user x64 installer intentionally refuses Windows ARM64. Its standard-user/UAC path is verified on the x64 Windows Server candidate job.
        if: ${{ inputs.probe_mode == 'acceptance' && runner.arch == 'X64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_standard_user_acceptance.ps1 `
            -InstallerPath (Join-Path (Get-Location) 'release/EyeBreakReminder-Setup-x64.exe') `
            -ExecutablePath (Join-Path (Get-Location) 'release/EyeBreakReminder.exe') `
            -EvidenceDirectory (Join-Path (Get-Location) 'build/arm64-emulation-retest/standard-user')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory WinMM and WASAPI render endpoints without playing audio
        if: ${{ inputs.probe_mode == 'audio-inventory' }}
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'build/audio-endpoint-evidence' | Out-Null
          $context = Get-Content -LiteralPath 'candidate-identity-retest.json' -Raw | ConvertFrom-Json
          & .\tests\windows_audio_endpoint_inventory.ps1 `
            -EvidenceDirectory 'build/audio-endpoint-evidence' `
            -CandidateRunId $env:CANDIDATE_RUN_ID `
            -CandidateExeSHA256 $context.SHA256.'EyeBreakReminder.exe'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath 'candidate-identity-retest.json' -Destination 'build/audio-endpoint-evidence/candidate-identity-retest.json'

      - name: Upload ARM64 emulation retest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eye-break-reminder-v1.3.0-arm64-emulation-retest-${{ github.run_id }}
          path: |
            candidate-identity-retest.json
            build/arm64-emulation-retest/**
            build/audio-endpoint-evidence/**
          if-no-files-found: warn
          retention-days: 90

  windows-server-display-change:
    name: ${{ inputs.probe_mode == 'tray-narrator-only' && 'Exact-candidate Narrator modal and tray recovery on Windows x64' || inputs.probe_mode == 'standard-user-only' && 'Exact-candidate standard-user Settings and UAC probe on Windows x64' || inputs.probe_mode == 'installed-only' && 'Exact-candidate installed-app lifecycle acceptance on Windows x64' || 'Exact-candidate display-resolution change on Windows x64' }}
    if: ${{ inputs.probe_mode == 'acceptance' || inputs.probe_mode == 'display-only' || inputs.probe_mode == 'standard-user-only' || inputs.probe_mode == 'installed-only' || inputs.probe_mode == 'tray-narrator-only' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the feature-branch display-test harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the requested retained candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.3.0-VERIFIED-RELEASE-CANDIDATE
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Download the requested candidate seal
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: eye-break-reminder-v1.3.0-final-pre-release-evidence-${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-evidence

      - name: Verify exact candidate provenance on the Windows x64 runner
        id: candidate_identity
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_RUN_ID -notmatch '^\d{5,}$') { throw "Invalid candidate run ID: '$env:CANDIDATE_RUN_ID'." }
          $run = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID"
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_branch -cne 'feature/v1.3.0-custom-accent-colours') { throw 'Requested candidate run must have completed successfully on the authorized feature branch.' }
          $runJobs = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID/jobs?per_page=100"
          if (-not @($runJobs.jobs | Where-Object { $_.name -eq 'windows-pre-release' -and $_.conclusion -eq 'success' }).Count) { throw 'Requested run has no successful candidate-producing Windows pre-release job.' }
          $sealPath = Get-ChildItem -LiteralPath 'candidate-evidence' -Recurse -Filter 'authoritative-release-candidate.json' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sealPath) { throw 'Candidate evidence artifact lacks the authoritative release seal.' }
          $seal = Get-Content -LiteralPath $sealPath -Raw | ConvertFrom-Json
          if ($seal.RunId -ne $env:CANDIDATE_RUN_ID -or $seal.SourceCommit -cne $run.head_sha -or $seal.Version -ne '1.3.0' -or $seal.Application -ne 'Eye Break Reminder' -or $seal.ArtifactFiles.Count -ne 5) { throw 'The candidate seal does not match the requested successful run, source commit, version, and five-file inventory.' }
          $expectedNames = @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip','EyeBreakReminder-SHA256.txt')
          $actualNames = @(Get-ChildItem -LiteralPath 'release' -File | Sort-Object Name | Select-Object -ExpandProperty Name)
          if (($actualNames -join "`n") -cne (($expectedNames | Sort-Object) -join "`n")) { throw "Unexpected candidate file set: $($actualNames -join ', ')." }
          foreach ($item in $seal.ArtifactFiles) {
            $file = Join-Path 'release' $item.Name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Candidate artifact is missing $($item.Name)." }
            $info = Get-Item -LiteralPath $file
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($info.Length -ne [long]$item.Bytes -or $hash -cne ([string]$item.SHA256).ToLowerInvariant()) { throw "Candidate identity mismatch for $($item.Name)." }
          }
          $executableSha256 = (Get-FileHash -LiteralPath 'release/EyeBreakReminder.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$executableSha256" >> $env:GITHUB_OUTPUT
          "source_commit=$($seal.SourceCommit)" >> $env:GITHUB_OUTPUT
          $seal | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath 'candidate-display-change-seal.json' -Encoding UTF8

      - name: Run the reminder through a real display-resolution change
        if: ${{ inputs.probe_mode == 'acceptance' || inputs.probe_mode == 'display-only' }}
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE_COMMIT: ${{ steps.candidate_identity.outputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_display_change_acceptance.ps1 `
            -ExecutablePath '.\release\EyeBreakReminder.exe' `
            -ExpectedSha256 '${{ steps.candidate_identity.outputs.sha256 }}' `
            -EvidenceDirectory '.\build\windows-display-change-evidence'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retry standard-user installer, Settings uninstall, and UAC
        if: ${{ inputs.probe_mode == 'standard-user-only' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_standard_user_acceptance.ps1 `
            -InstallerPath (Join-Path (Get-Location) 'release/EyeBreakReminder-Setup-x64.exe') `
            -ExecutablePath (Join-Path (Get-Location) 'release/EyeBreakReminder.exe') `
            -EvidenceDirectory (Join-Path (Get-Location) 'build/windows-standard-user-evidence')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retest the exact candidate installed-app, tray, and lifecycle acceptance
        if: ${{ inputs.probe_mode == 'installed-only' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_pre_release_acceptance.ps1 `
            -InstallerPath (Join-Path (Get-Location) 'release/EyeBreakReminder-Setup-x64.exe') `
            -EvidenceDirectory (Join-Path (Get-Location) 'build/pre-release-evidence')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retest exact-candidate tray commands after Narrator navigation
        if: ${{ inputs.probe_mode == 'tray-narrator-only' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_pre_release_acceptance.ps1 `
            -InstallerPath (Join-Path (Get-Location) 'release/EyeBreakReminder-Setup-x64.exe') `
            -EvidenceDirectory (Join-Path (Get-Location) 'build/pre-release-evidence') `
            -TrayNarratorOnly
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload exact-candidate display-change evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eye-break-reminder-v1.3.0-${{ inputs.probe_mode }}-${{ inputs.candidate_run_id }}-${{ github.run_id }}
          path: |
            candidate-display-change-seal.json
            build/windows-display-change-evidence/**
            build/windows-standard-user-evidence/**
            build/pre-release-evidence/**
          if-no-files-found: warn
          retention-days: 90
