name: Windows 11 ARM64 exact-candidate emulation retest

on:
  push:
    branches:
      - feature/v1.3.0-custom-accent-colours
    paths:
      - .github/workflows/windows-11-arm64-candidate-validation.yml
      - .github/workflows/windows-pre-release-validation.yml
      - tests/windows_arm64_emulation_acceptance.ps1

permissions:
  contents: read

jobs:
  arm64-candidate-emulation:
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the acceptance harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download the exact retained candidate from run 43698996008
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: EyeBreakReminder-v1.3.0-VERIFIED-RELEASE-CANDIDATE
          repository: ${{ github.repository }}
          run-id: 43698996008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release

      - name: Download the candidate's sealed provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: eye-break-reminder-v1.3.0-final-pre-release-evidence-43698996008
          repository: ${{ github.repository }}
          run-id: 43698996008
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate-evidence

      - name: Verify the exact candidate and source provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedNames = @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip','EyeBreakReminder-SHA256.txt')
          $releaseEntries = @(Get-ChildItem -LiteralPath 'release' -Force)
          if ($releaseEntries.Count -ne 5 -or @($releaseEntries | Where-Object PSIsContainer).Count -ne 0) { throw 'Candidate directory must contain exactly five files and no subdirectories.' }
          $actualNames = @($releaseEntries | Sort-Object Name | Select-Object -ExpandProperty Name)
          if (($actualNames -join "`n") -cne (($expectedNames | Sort-Object) -join "`n")) { throw "Unexpected candidate file set: $($actualNames -join ', ')" }
          $fixed = @{
            'EyeBreakReminder.exe' = 'e6ba8b8bead1b86cd0b07e990cc543b8ed8a8a691f73c70e310de35a3f0a6afd'
            'EyeBreakReminder-Setup-x64.exe' = '269795f500c2e4210ac02750997b39284c0ac0f8f2d6ef05878dfe05ba4525f2'
            'EyeBreakReminder-Portable-x64.zip' = '57406c46d7e3c75cae65c544ee5be9e509e3f37eba750f5d19c397dcd8f84d22'
            'EyeBreakReminder-Source.zip' = 'a1b4fa79034696eb43cd6db7ea2e123c887965bd0e428133fbbb6e97fbcdd670'
            'EyeBreakReminder-SHA256.txt' = '0de021530fd7d3cbfd6abbbfbf359f5c1039e524a2d789f1123a6e561e77df96'
          }
          $manifest = Get-Content -LiteralPath 'release/EyeBreakReminder-SHA256.txt'
          if ($manifest.Count -ne 4) { throw 'Candidate SHA-256 manifest must contain exactly four payloads.' }
          foreach ($name in @('EyeBreakReminder.exe','EyeBreakReminder-Setup-x64.exe','EyeBreakReminder-Portable-x64.zip','EyeBreakReminder-Source.zip')) {
            $matchingLines = @($manifest | Where-Object { $_ -match ('^[0-9a-f]{64}  ' + [regex]::Escape($name) + '$') })
            if ($matchingLines.Count -ne 1) { throw "Manifest entry missing or duplicated: $name" }
            $manifestMatch = [regex]::Match($matchingLines[0], '^([0-9a-f]{64})  ' + [regex]::Escape($name) + '$')
            if (-not $manifestMatch.Success -or $manifestMatch.Groups[1].Value -cne $fixed[$name]) { throw "Manifest SHA does not match the pinned candidate identity for $name" }
            $actual = (Get-FileHash -LiteralPath (Join-Path 'release' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $fixed[$name]) { throw "Downloaded candidate hash mismatch for ${name}: $actual" }
          }
          $manifestHash = (Get-FileHash -LiteralPath 'release/EyeBreakReminder-SHA256.txt' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifestHash -cne $fixed['EyeBreakReminder-SHA256.txt']) { throw "Downloaded candidate manifest hash mismatch: $manifestHash" }
          $exe = Get-Item -LiteralPath 'release/EyeBreakReminder.exe'
          $setup = Get-Item -LiteralPath 'release/EyeBreakReminder-Setup-x64.exe'
          if ($exe.VersionInfo.ProductVersion -notmatch '^1\.3\.0(\.0)?$' -or $setup.VersionInfo.ProductVersion -notmatch '^1\.3\.0(\.0)?$') { throw 'Downloaded candidate is not version 1.3.0.' }
          $sealPath = Get-ChildItem -LiteralPath 'candidate-evidence' -Recurse -Filter 'authoritative-release-candidate.json' | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sealPath) { throw 'Candidate seal was not present in the evidence artifact.' }
          $seal = Get-Content -LiteralPath $sealPath -Raw | ConvertFrom-Json
          if ($seal.RunId -ne '43698996008' -or $seal.SourceCommit -ne 'a447a5fd7a1d9822ba83e6dd990b6faa84e64ad4' -or $seal.Tests.ProductionExecutableSHA256 -ne $fixed['EyeBreakReminder.exe']) { throw 'Candidate seal does not identify the pinned run, source commit, and executable.' }
          [pscustomobject]@{CandidateRunId=$seal.RunId;CandidateSourceCommit=$seal.SourceCommit;SourceArchiveSHA256=$fixed['EyeBreakReminder-Source.zip'];AcceptanceHarnessCommit=$env:GITHUB_SHA;OS=(Get-CimInstance Win32_OperatingSystem).Caption;OSArchitecture=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString();CandidateFiles=@($expectedNames);SHA256=$fixed;ExecutableVersion=$exe.VersionInfo.ProductVersion;InstallerVersion=$setup.VersionInfo.ProductVersion} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'candidate-identity-retest.json' -Encoding UTF8

      - name: Test installer policy and application under ARM64 x64 emulation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\windows_arm64_emulation_acceptance.ps1 `
            -InstallerPath (Join-Path (Get-Location) 'release/EyeBreakReminder-Setup-x64.exe') `
            -StandaloneExecutable (Join-Path (Get-Location) 'release/EyeBreakReminder.exe') `
            -PortableArchive (Join-Path (Get-Location) 'release/EyeBreakReminder-Portable-x64.zip') `
            -EvidenceDirectory (Join-Path (Get-Location) 'build/arm64-emulation-retest') `
            -CandidateSourceCommit 'a447a5fd7a1d9822ba83e6dd990b6faa84e64ad4'
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ARM64 emulation retest evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eye-break-reminder-v1.3.0-arm64-emulation-retest-${{ github.run_id }}
          path: |
            candidate-identity-retest.json
            build/arm64-emulation-retest/**
          if-no-files-found: warn
          retention-days: 90
